# Temporary: generates go.sum and the gqlgen code on GitHub (where the Go
# checksum database is reachable) and commits them to this branch.
name: Codegen

on:
  push:
    branches: [fix/make-readme-true]
    paths: [".github/workflows/codegen.yml", "backend/gqlgen.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: |
          rm -f go.sum
          go mod tidy
          go run github.com/99designs/gqlgen generate 2>&1 | tee build.log
          go mod tidy
          gofmt -w .
          go build ./... 2>&1 | tee build.log || true
          go vet ./... 2>&1 | tee -a build.log || true
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "Generate go.sum and GraphQL code" || echo "nothing to commit"
          git push
