name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskboard_test?sslmode=disable
      REDIS_TEST_ADDR: localhost:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Generated code is up to date
        run: |
          go run github.com/99designs/gqlgen generate
          git diff --exit-code -- graph/
      - name: Vet and format
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Unit tests with coverage (>= 95%)
        run: ../scripts/coverage.sh
      - name: Integration and performance tests
        run: go test ./tests/... -v -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t taskboard-backend ./backend
          docker build -t taskboard-frontend ./frontend
      - name: Smoke test the stack
        run: |
          docker compose up -d --build postgres redis backend
          for i in $(seq 1 30); do curl -fs localhost:8080/ready && break; sleep 2; done
          curl -fs localhost:8080/ready
          curl -fs -X POST localhost:8080/api/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"Str0ng!Pass","name":"CI"}' | grep -q token
          docker compose down -v
