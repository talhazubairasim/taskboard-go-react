# Template only: replace the values before applying, or create the secret with
#   kubectl -n taskboard create secret generic taskboard-secrets \
#     --from-literal=postgres-password=... --from-literal=database-url=... \
#     --from-literal=jwt-secret=... --from-literal=jwt-refresh-secret=...
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-secrets
  namespace: taskboard
type: Opaque
stringData:
  postgres-password: CHANGE_ME
  database-url: postgresql://taskboard:CHANGE_ME@postgres-service:5432/taskboard?sslmode=disable
  jwt-secret: CHANGE_ME_TO_A_LONG_RANDOM_STRING
  jwt-refresh-secret: CHANGE_ME_TO_ANOTHER_LONG_RANDOM_STRING
