apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-frontend
  namespace: taskboard
  labels:
    app: taskboard-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskboard-frontend
  template:
    metadata:
      labels:
        app: taskboard-frontend
    spec:
      containers:
        - name: frontend
          # Built with the production target of frontend/Dockerfile (nginx on port 80).
          image: gcr.io/YOUR_PROJECT_ID/taskboard-frontend:latest
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: taskboard
spec:
  selector:
    app: taskboard-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
